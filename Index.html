<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Plaza</title>

    <!-- Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="Styles/styles.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

    <a class="site-logo" href="Index.html" aria-label="La Plaza">
        La Plaza
    </a>

    <button
        class="menu-button"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="site-menu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

</header>


<nav
    id="site-menu"
    class="site-menu"
    aria-label="Menú principal"
>

    <ul class="site-menu__links">

        <li>
            <a
                class="site-menu__link"
                href="#cartelera"
            >
                Cartelera
            </a>
        </li>

        <li>
            <a
                class="site-menu__link"
                href="Entradas.html"
            >
                Entradas
            </a>
        </li>

    </ul>

</nav>


    <!-- =========================
         HERO
    ========================== -->

    <main>

        <section class="hero" aria-label="La Plaza">

            <img
                class="hero__image"
                src="Media/Img/03.webp"
                alt="Gente en un festival"
            >

            <div class="hero__content">

                <h1 class="hero__title">
                    La Plaza
                </h1>

                <nav class="hero__actions" aria-label="Navegación principal">

                    <a
                        class="hero__button hero__button--primary"
                        href="#cartelera"
                    >
                        Cartelera
                    </a>

                    <a
                        class="hero__button hero__button--secondary"
                        href="Entradas.html"
                    >
                        Entradas
                    </a>

                </nav>

            </div>


            <!-- Indicador de scroll -->

            <a
                class="scroll-indicator"
                href="#cartelera"
                aria-label="Bajar a la siguiente sección"
            >
                <span></span>
            </a>

        </section>
        

<section id="cartelera" class="about-section">

    <div class="about-section__content">

        <h2 class="about-section__title">
            La Plaza de Madrid
            <span>v.2026</span>
        </h2>

        <p>
            Otro año más dónde la música urbana, el arte y la cultura
            contemporánea se junta con <strong>todos vosotros.</strong>
        </p>

        <p>
            Dos días Para vivir Madrid de otra manera!
        </p>

    </div>

    <div class="about-section__visual">

        <img
            class="about-section__image"
            src="Media/Img/09.webp"
            alt="Dos chicos en un festival"
        >

        <img
            class="about-section__graphic"
            src="Media/Graficos/GráficosLaPlaza-02.svg"
            alt=""
            aria-hidden="true"
        >

    </div>

</section>

    </main>


    <!-- JavaScript -->
    <script src="Js/main.js"></script>

</body>
</html>
